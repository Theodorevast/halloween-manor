<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>engine check</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #info { position: fixed; left: 8px; top: 8px; font: 12px/1.4 ui-monospace, monospace; color: #9fb; white-space: pre; pointer-events: none; text-shadow: 0 0 3px #000; }
      #marker { position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin: -8px 0 0 -8px; border: 1px solid #f33; border-radius: 50%; pointer-events: none; display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="marker"></div>
    <div id="info"></div>
    <script type="module" src="./engine.ts"></script>
  </body>
</html>
